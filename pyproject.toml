[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "modelx-cython-extension"
version = "0.1.0+phase2r1b"
description = "Experimental native lowering extension for official modelx-cython"
requires-python = ">=3.11"
dependencies = ["modelx==0.33.0", "modelx-cython==0.1.0", "numpy>=1.26", "pandas>=2", "Cython>=3", "networkx>=3", "libcst>=1.9", "MonkeyType>=23.3", "openpyxl>=3.1", "asttokens>=3"]
[project.optional-dependencies]
lifelib = ["lifelib==0.17.1"]
[tool.setuptools.packages.find]
where = ["."]
include = ["modelx_graph*"]
