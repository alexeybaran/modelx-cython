name: DV01 CSV without optional ESG dependencies

on:
  push:
    branches: [verify/r3-dv01-data-csv]

permissions:
  contents: read

jobs:
  test:
    name: DV01 input check on ${{ matrix.os }} with Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: windows-latest, python: '3.14'}
          - {os: macos-15-intel, python: '3.10'}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: alexeybaran/lifelib
          ref: aef70a0de23b3ca677cdaf3b61aa9a302243e7b4
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install standard test dependencies
        shell: bash
        run: |
          python -m pip install -e '.[test]' 'modelx @ git+https://github.com/alexeybaran/modelx.git@f0e91ec74f3363104f27a220d6584a639a4cf1e2'
          python -c "import importlib.util; assert importlib.util.find_spec('scipy') is None"
      - name: Verify the two original CSV inventory cases
        shell: bash
        run: |
          node=lifelib/libraries/uslib/tests/test_model_conventions.py::test_every_csv_beside_the_model_is_actually_read
          python -m pytest -q "${node}[MYGA_US_S]" "${node}[MYGA_US_SEC]"
