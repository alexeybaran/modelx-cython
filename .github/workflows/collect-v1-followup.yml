name: Collect hook compatibility and constant table keys

on:
  push:
    branches: [verify/regional-collect-v1-1]

jobs:
  collect-fixtures:
    name: Ubuntu CPython 3.14.10t
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHON_GIL: '0'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10t'
      - name: Install pinned compiler and modelx
        run: |
          python -m pip install --only-binary libcst,numpy,pandas \
            'Cython==3.3.2' 'libcst==1.9.0' 'numpy==2.5.5' 'pandas==3.1.1' \
            'pytest==9.2.0' 'setuptools==84.2.1' 'MonkeyType==23.3.0' 'openpyxl==3.1.5' 'psutil==7.2.2' \
            'git+https://github.com/alexeybaran/modelx@fdc19875bd2445a7093e56e7222ecc1cf29c2ac0'
          python -m pip install --no-deps .
      - name: Test the Collect hook guard and constant table keys
        working-directory: ${{ runner.temp }}
        run: |
          python -c 'import sys; print(sys.version); assert sys.version_info[:3] == (3, 14, 10) and not sys._is_gil_enabled()'
          python -m pytest --rootdir "$GITHUB_WORKSPACE" -p no:cacheprovider -q -rA \
            "$GITHUB_WORKSPACE/modelx_cython/tests/compiled/test_parallel_collect_reuse.py::test_obsolete_collect_export_requests_reexport" \
            "$GITHUB_WORKSPACE/integration_tests/test_constant_key_reads.py::test_constant_key_reads_use_enum_constants_and_held_codes"
