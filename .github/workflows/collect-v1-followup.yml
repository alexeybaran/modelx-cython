name: Native Collect argument and locked domains

on:
  push:
    branches: [verify/regional-collect-v1-1]

jobs:
  collect-fixtures:
    name: Ubuntu CPython 3.14.10t
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHON_GIL: '0'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10t'
      - name: Install pinned compiler and modelx
        run: |
          python -m pip install --only-binary libcst,numpy,pandas \
            'Cython==3.3.2' 'libcst==1.9.0' 'numpy==2.5.5' 'pandas==3.1.1' \
            'pytest==9.2.0' 'setuptools==84.2.1' 'MonkeyType==23.3.0' 'openpyxl==3.1.5' 'psutil==7.2.2' \
            'git+https://github.com/alexeybaran/modelx@fdc19875bd2445a7093e56e7222ecc1cf29c2ac0'
          python -m pip install --no-deps .
      - name: Test Collect argument and locked domains
        working-directory: ${{ runner.temp }}
        run: |
          python -c 'import sys; print(sys.version); assert sys.version_info[:3] == (3, 14, 10) and not sys._is_gil_enabled()'
          suite="$GITHUB_WORKSPACE/modelx_cython/tests/compiled"
          python -m pytest --rootdir "$GITHUB_WORKSPACE" --basetemp "$RUNNER_TEMP/domain-tests" -p no:cacheprovider -q -rA \
            "$suite/test_collect_native_merge.py::test_collect_with_other_parameters_is_native_per_argument_set" \
            "$suite/test_locked_numeric_domains.py::test_locked_native_calls_and_dependent_collect_domain"
      - name: Print generated native domain dispatch on failure
        if: failure()
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP/domain-tests" -path '*/exported_cy/_mx_classes.py' -exec \
            grep -H -nE 'def _mx_gather_|integer_keys\(|def _mx_collect_hook\(' {} + || true
