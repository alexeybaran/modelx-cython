name: Portable exact sum

on:
  push:
    branches: [verify/regional-portable-sum-1]

jobs:
  exact-sum:
    name: Windows CPython ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12.4', '3.12.5', '3.14t']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Free-threaded interpreter without the GIL
        if: endsWith(matrix.python, 't')
        shell: bash
        run: echo 'PYTHON_GIL=0' >> "$GITHUB_ENV"
      - name: Install pinned compiler test dependencies
        shell: bash
        run: |
          python -m pip install --only-binary libcst 'Cython==3.3.2' pytest setuptools \
            'git+https://github.com/alexeybaran/modelx@fdc19875bd2445a7093e56e7222ecc1cf29c2ac0'
          python -m pip install --no-deps .
      - name: Record interpreter and run exact sum tests
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python -c 'import sys; print(sys.version)'
          if [[ '${{ matrix.python }}' == *t ]]; then
            python -c 'import sys; assert not sys._is_gil_enabled()'
          fi
          python -m pytest --rootdir "$GITHUB_WORKSPACE" --basetemp=C:/t -p no:cacheprovider -q \
            "$GITHUB_WORKSPACE/modelx_cython/tests/test_exact_sum_state.py"
