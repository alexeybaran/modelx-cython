name: Pinned live formula stack qualification

on:
  push:
    branches: [verify/r3-deep-stack-runtime]

permissions:
  contents: read

env:
  MODELX_REV: 636877bfe1a8f1398044c15cbc70802d8f15fc4e
  LIFELIB_REV: 04d69dbb16a9a49f2d569047a8deebdc1f026c28

jobs:
  modelx:
    name: modelx ${{ matrix.os }} Python ${{ matrix.py }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15-intel, py: '3.10.21', nx: '2.7'}
          - {os: macos-15-intel, py: '3.11', nx: '2.8'}
          - {os: macos-latest, py: '3.10', nx: '2.7'}
          - {os: windows-latest, py: '3.10', nx: '2.7'}
          - {os: ubuntu-latest, py: '3.10', nx: '2.7'}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: alexeybaran/modelx
          ref: ${{ env.MODELX_REV }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Install test dependencies
        shell: bash
        env:
          NETWORKX_VERSION: ${{ matrix.nx }}
        run: python -m pip install -r requirements-travis.txt
      - name: Check executor and run modelx suite
        shell: bash
        run: |
          python -c 'import platform, sys; from modelx.core.system import mxsys; print(sys.version, platform.machine(), type(mxsys.executor).__name__)'
          python -m pytest -q --junitxml=unit.xml modelx/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelx-${{ matrix.os }}-${{ matrix.py }}-junit
          path: unit.xml

  lifelib:
    name: lifelib Intel macOS Python 3.10.21
    runs-on: macos-15-intel
    timeout-minutes: 75
    env:
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: alexeybaran/lifelib
          ref: ${{ env.LIFELIB_REV }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.21'
          architecture: x64
      - name: Install matched test dependencies
        run: |
          python -m pip install -e ".[test]" "modelx @ git+https://github.com/alexeybaran/modelx.git@${MODELX_REV}" \
            numpy==2.2.6 pandas==2.3.3 networkx==3.4.2 libcst==1.9.0
      - name: Verify the previously failing FRV policy on the default executor
        run: |
          python -c 'import platform; from modelx.core.system import ThreadedExecutor, mxsys; assert platform.machine() == "x86_64"; assert type(mxsys.executor) is ThreadedExecutor'
          python -m pytest -q --junitxml=frv.xml 'lifelib/libraries/delib/tests/test_fondsgebundene_rentenversicherung_de.py::test_the_reduction_in_yield_across_the_four_charge_scales[5]'
      - name: Run the lifelib Python floor suite
        if: ${{ !cancelled() && success() }}
        run: python -m pytest -q --junitxml=lifelib.xml --ignore-glob='*test_*_us_sec.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifelib-intel-macos-junit
          path: |
            frv.xml
            lifelib.xml
