name: Pinned standard macOS runtime control

on:
  push:
    branches: [verify/r3-deep-stack-arm-control]

permissions:
  contents: read

env:
  MODELX_REV: 636877bfe1a8f1398044c15cbc70802d8f15fc4e

jobs:
  modelx:
    name: modelx ${{ matrix.os }} Python ${{ matrix.py }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, py: '3.10', nx: '2.7'}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: alexeybaran/modelx
          ref: ${{ env.MODELX_REV }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Install test dependencies
        shell: bash
        env:
          NETWORKX_VERSION: ${{ matrix.nx }}
        run: python -m pip install -r requirements-travis.txt
      - name: Check executor and run modelx suite
        shell: bash
        run: |
          python -c 'import platform, sys; from modelx.core.system import mxsys; print(sys.version, platform.machine(), type(mxsys.executor).__name__)'
          python -m pytest -q --junitxml=unit.xml modelx/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelx-${{ matrix.os }}-${{ matrix.py }}-junit
          path: unit.xml
