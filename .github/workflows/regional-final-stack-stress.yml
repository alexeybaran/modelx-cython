name: Regional final-stack bounded stress

on:
  push:
    branches: [verify/regional-final-stack-stress-1]

jobs:
  stress:
    name: ${{ matrix.os }} CPython 3.14.10t
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      MODELX_COMMIT: d79f37b8a42448e317f0a33c53cb475769585c1c
      COMPILER_TEST_COMMIT: 3d9c1aa1e9b8fb04728f1eeb541fdd7f4c40148b
      PYTEST_ADDOPTS: ${{ matrix.os == 'windows-latest' && '--basetemp=C:/t' || '' }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/checkout@v4
        with:
          repository: alexeybaran/modelx
          ref: ${{ env.MODELX_COMMIT }}
          path: pinned-modelx
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10t'
      - name: Enable free-threaded tests
        shell: bash
        run: echo 'PYTHON_GIL=0' >> "$GITHUB_ENV"
      - name: Install exact runtime and compiler
        shell: bash
        run: |
          python -m pip install --only-binary libcst,numpy,pandas \
            'Cython==3.3.2' 'libcst==1.9.0' 'numpy==2.5.5' 'pandas==3.1.1' \
            'pytest==9.2.0' 'setuptools==84.2.1' 'MonkeyType==23.3.0' 'openpyxl==3.1.5' 'psutil==7.2.2' \
            "modelx @ git+https://github.com/alexeybaran/modelx@${MODELX_COMMIT}"
          # The pinned fork advertises 0.33.0 and the compiler requires 0.33.1.dev0.
          python -m pip install --no-deps .
      - name: Run bounded concurrency checks
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          from xml.etree import ElementTree

          import modelx
          import modelx_cython

          root = Path(os.environ['GITHUB_WORKSPACE'])
          modelx_checkout = root / 'pinned-modelx'
          modelx_commit = os.environ['MODELX_COMMIT']
          compiler_test_commit = os.environ['COMPILER_TEST_COMMIT']
          source = json.loads(metadata.distribution('modelx').read_text('direct_url.json'))
          commit = source['vcs_info']['commit_id']
          checkout = subprocess.check_output(['git', '-C', modelx_checkout, 'rev-parse', 'HEAD'], text=True).strip()
          parent = subprocess.check_output(['git', '-C', root, 'rev-parse', 'HEAD^'], text=True).strip()
          print(sys.version, 'GIL enabled:', sys._is_gil_enabled(), 'modelx:', commit, 'compiler tests:', parent)
          assert sys.version_info[:3] == (3, 14, 10) and not sys._is_gil_enabled()
          assert checkout == commit == modelx_commit and parent == compiler_test_commit

          export_file = modelx_checkout / 'modelx/tests/export/test_collect_export.py'
          exports = [f'{export_file}::{name}' for name in (
              'test_parallel_export_collect_same_key_shares_in_flight_result',
              'test_parallel_export_overlaps_private_items_and_shares_locked_dependencies',
              'test_export_collect_error_allows_retry',
              'test_parallel_export_collect_does_not_wait_with_the_model_lock',
              'test_parallel_export_detects_a_cycle_between_running_collects',
              'test_parallel_export_folds_nested_python_values_in_domain_order',
          )]
          compiled_root = root / 'modelx_cython/tests/compiled'
          compiled = [f'{compiled_root / file}::{name}' for file, name in (
              ('test_collect_shared_items.py', 'test_collect_shares_referenced_items_and_keeps_serial_items_owned'),
              ('test_parallel_collect_reuse.py', 'test_parallel_collect_reuse_merges_completed_chunks_and_retries'),
              ('test_locked_numeric_domains.py', 'test_locked_native_calls_and_dependent_collect_domain'),
          )]

          def run(case, rootdir, selectors, expected, timeout):
              print(case, flush=True)
              junit = Path(f'{case}.xml')
              subprocess.run([
                  sys.executable, '-m', 'pytest', '--import-mode=importlib', '--rootdir', str(rootdir),
                  '-p', 'no:cacheprovider', '-q', '-rA', '--junitxml', str(junit), *selectors,
              ], check=True, timeout=timeout)
              cases = ElementTree.parse(junit).findall('.//testcase')
              assert len(cases) == expected and all(item.find('skipped') is None for item in cases)

          for repeat in range(1, 4):
              run(f'standalone-{repeat}', modelx_checkout, exports, expected=8, timeout=90)
          run('compiled', root, compiled, expected=3, timeout=600)
          PY
