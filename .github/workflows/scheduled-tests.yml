name: Scheduled tests

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  fuzz-and-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14', '3.14t']
    env:
      PYTHON_GIL: ${{ matrix.python == '3.14t' && '0' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: alexeybaran/modelx
          ref: ac6fc71fa15b0041c0d22eb281de21eefa05e3b4
          path: dependencies/modelx
      - uses: actions/checkout@v4
        with:
          repository: alexeybaran/lifelib
          ref: 15e1956929940d48ef9cca35a29accc0551771a3
          path: dependencies/lifelib
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./dependencies/modelx[helpers]" ./dependencies/lifelib
          python -m pip install . pytest pandas openpyxl psutil
          python -m pip list
      - name: Full fuzz and stress tests
        timeout-minutes: 200
        shell: bash
        run: >
          python -m pytest integration_tests -m "fuzz_full or stress" -rfE -q
          --junitxml=reports/scheduled.xml
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-scheduled-py${{ matrix.python }}
          path: reports/*.xml
          if-no-files-found: warn
