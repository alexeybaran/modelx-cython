name: Borrowed vectors and locked Collect caches

on:
  push:
    branches: [verify/regional-collect-fixtures-2]

jobs:
  collect-fixtures:
    name: ${{ matrix.os }} CPython 3.14.10t
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTEST_ADDOPTS: ${{ matrix.os == 'windows-latest' && '--basetemp=C:/t' || '' }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10t'
      - name: Free-threaded interpreter without the GIL
        shell: bash
        run: echo 'PYTHON_GIL=0' >> "$GITHUB_ENV"
      - name: Install pinned compiler and modelx
        shell: bash
        run: |
          python -m pip install --only-binary libcst,numpy,pandas \
            'Cython==3.3.2' 'libcst==1.9.0' 'numpy==2.5.5' 'pandas==3.1.1' \
            'pytest==9.2.0' 'setuptools==84.2.1' 'MonkeyType==23.3.0' 'openpyxl==3.1.5' 'psutil==7.2.2' \
            'git+https://github.com/alexeybaran/modelx@fdc19875bd2445a7093e56e7222ecc1cf29c2ac0'
          python -m pip install --no-deps .
      - name: Run the two Collect fixtures
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python -c 'import sys; print(sys.version); assert sys.version_info[:3] == (3, 14, 10) and not sys._is_gil_enabled()'
          suite="$GITHUB_WORKSPACE/modelx_cython/tests/compiled"
          python -m pytest --rootdir "$GITHUB_WORKSPACE" -p no:cacheprovider -q -rA \
            "$suite/test_collect_shared_items.py" "$suite/test_vector_python_exits.py"
