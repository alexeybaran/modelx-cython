name: Pinned lifelib Python floor on default macOS

on:
  push:
    branches: [verify/r3-dv01-lifelib-mac310-arm]

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ['3.10']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: alexeybaran/lifelib
        ref: aef70a0de23b3ca677cdaf3b61aa9a302243e7b4
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e .[test] "modelx @ git+https://github.com/alexeybaran/modelx.git@f0e91ec74f3363104f27a220d6584a639a4cf1e2"
    - name: Run tests with pytest
      # uslib's _US_SEC test modules are left to the `sec` job below, as in
      # lifelib-products' CI: they hold each SEC model to its S twin bit for bit, and
      # parts of that hold only on the interpreter upstream verifies them on (S's sum()
      # of floats is compensated from Python 3.12, and 3.14 rewords ZeroDivisionError).
      # The SEC models themselves, their conventions and sec_support still run here.
      run: |
        pytest -v --ignore-glob='*test_*_us_sec.py'
