name: Verified Regional Collect fixtures

on:
  push:
    branches: [verify/regional-repair-fixtures-1]

jobs:
  collect-fixtures:
    name: ${{ matrix.os }} CPython 3.14.10t
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTEST_ADDOPTS: ${{ matrix.os == 'windows-latest' && '--basetemp=C:/t' || '' }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10t'
      - name: Enable free-threaded tests
        shell: bash
        run: echo 'PYTHON_GIL=0' >> "$GITHUB_ENV"
      - name: Install exact runtime and compiler
        shell: bash
        run: |
          python -m pip install --only-binary libcst,numpy,pandas \
            'Cython==3.3.2' 'libcst==1.9.0' 'numpy==2.5.5' 'pandas==3.1.1' \
            'pytest==9.2.0' 'setuptools==84.2.1' 'MonkeyType==23.3.0' 'openpyxl==3.1.5' 'psutil==7.2.2' \
            'git+https://github.com/alexeybaran/modelx@fdc19875bd2445a7093e56e7222ecc1cf29c2ac0'
          # The fork's installed version predates the compiler's declared dependency floor.
          python -m pip install --no-deps .
      - name: Verify the ten ported cases
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata
          import json
          import sys
          import modelx
          import modelx_cython
          source = json.loads(importlib.metadata.distribution('modelx').read_text('direct_url.json'))
          commit = source['vcs_info']['commit_id']
          print(sys.version, 'GIL enabled:', sys._is_gil_enabled(), 'modelx commit:', commit)
          assert sys.version_info[:3] == (3, 14, 10) and not sys._is_gil_enabled()
          assert commit == 'fdc19875bd2445a7093e56e7222ecc1cf29c2ac0'
          PY
          suite="$GITHUB_WORKSPACE/modelx_cython/tests/compiled"
          python -m pytest --rootdir "$GITHUB_WORKSPACE" -p no:cacheprovider -q -rA \
            "$suite/test_collect_name_collision.py::test_compiled_collect_cell_and_aggregation_remain_callable" \
            "$suite/test_factory_private_refs.py::test_factory_private_refs" \
            "$suite/test_collect_native_merge.py::test_native_and_python_outputs_equal_the_export" \
            "$suite/test_collect_shared_items.py::test_collect_shares_referenced_items_and_keeps_serial_items_owned" \
            "$suite/test_vector_python_exits.py::test_vector_python_exits" \
            "$suite/test_param_bounds.py::test_param_bounds_inherit_and_collect_check[model]" \
            "$suite/test_param_bounds.py::test_param_bounds_inherit_and_collect_check[space]" \
            "$GITHUB_WORKSPACE/integration_tests/test_held_table_handles.py::test_shared_table_reads_use_a_held_handle_and_results_stay"
