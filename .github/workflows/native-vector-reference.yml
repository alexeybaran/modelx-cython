name: Native vector reference qualification

on:
  push:
    branches: [verify/r3-native-vector-ref]

jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.14t"}
          - {os: windows-latest, python: "3.14t"}
          - {os: macos-15-intel, python: "3.14"}
    env:
      PYTHON_GIL: ${{ matrix.python == '3.14t' && '0' || '1' }}
      PYTEST_ADDOPTS: ${{ matrix.os == 'windows-latest' && '--basetemp=C:/t' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 713d08dbbd3b0ebf1f157da547778bacd5c9810a
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install . pytest "pandas>=2.2.2" "modelx @ git+https://github.com/alexeybaran/modelx.git@861396000edaae329d4473cdd97c0d1aea52a71f"
      - name: Verify free-threading on the 3.14t lanes
        if: matrix.python == '3.14t'
        run: python -c "import sys, sysconfig; assert sysconfig.get_config_var('Py_GIL_DISABLED') and not sys._is_gil_enabled()"
      - name: Run compiled feature tests
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest --import-mode=importlib -q \
            "$GITHUB_WORKSPACE/modelx_cython/tests/compiled/test_vector_ref_reads.py" \
            "$GITHUB_WORKSPACE/modelx_cython/tests/compiled/test_space_item_results.py" \
            "$GITHUB_WORKSPACE/modelx_cython/tests/compiled/test_factory_private_refs.py" \
            "$GITHUB_WORKSPACE/modelx_cython/tests/test_suffix_sums.py"
