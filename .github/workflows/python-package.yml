name: Regional compiled-suite verification

on:
  push:
    branches: [verify/regional-final-compiled-1]

# Recheck the compiled and integration suites with their fixture helper paths.
# Unit, allocation and SEC evidence stays with the exact-stack run.
# The companion commits for modelx and lifelib are pinned below.
# scipy, libcst, numpy and pandas are installed from wheels: their newest releases lack some 3.13t
# wheels; libcst (also a modelx dependency) does not build for 3.13t, and numpy and pandas
# built from source on Windows 3.13t failed to load; pip takes the newest release that has
# a wheel, or fails at once.
# macOS lanes are a job of their own, one at a time: queued macOS jobs were cancelled after
# 15 minutes without a runner.
# Python 3.10 is the declared floor (requires-python), as in lifelib.
jobs:
  lane:
    name: ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: '3.14t'}
          - {os: windows-latest, python-version: '3.12'}
          - {os: ubuntu-latest, python-version: '3.10'}
          - {os: ubuntu-latest, python-version: '3.12'}
          - {os: ubuntu-latest, python-version: '3.14'}
          - {os: ubuntu-latest, python-version: '3.13t'}
          - {os: windows-latest, python-version: '3.10'}
          - {os: windows-latest, python-version: '3.14'}
          - {os: windows-latest, python-version: '3.14t'}
          - {os: windows-latest, python-version: '3.13t'}
    env: &env
      PYTEST_ADDOPTS: ${{ matrix.os == 'windows-latest' && '--basetemp=C:/t' || '' }}
      PYTHONIOENCODING: utf-8
    steps: &steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # set after setup: on macOS the installer runs a Python of its own, which PYTHON_GIL=0 aborts
      - name: Free-threaded interpreter without the GIL
        if: endsWith(matrix.python-version, 't')
        shell: bash
        run: echo "PYTHON_GIL=0" >> "$GITHUB_ENV"
      - name: Install package, exact modelx and lifelib, and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary scipy,libcst,numpy,pandas \
            "modelx @ git+https://github.com/alexeybaran/modelx@990d5852ac8c3deed7e8646365dd4e16c63da368" \
            "lifelib @ git+https://github.com/alexeybaran/lifelib@e50454141680d0f9d65cce7ade81e4987f8c85ac" \
            "Cython>=3.2.4" libcst setuptools MonkeyType numpy pytest pytest-xdist "pandas>=2.2.2" openpyxl psutil
          # This verifies exact runtime code. Normal installation requires modelx>=0.33.1.dev0;
          # the pinned modelx commit currently advertises 0.33.0.
          python -m pip install --no-deps .
          python -m pip list
      - name: Verify companion checkout and interpreter
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import json
          import sys
          import sysconfig
          from modelx.export import _mx_collect

          pins = {
              'modelx': '990d5852ac8c3deed7e8646365dd4e16c63da368',
              'lifelib': 'e50454141680d0f9d65cce7ade81e4987f8c85ac',
          }
          for package, expected in pins.items():
              distribution = metadata.distribution(package)
              source = json.loads(distribution.read_text('direct_url.json'))
              commit = source['vcs_info']['commit_id']
              print(package, distribution.version, commit)
              assert commit == expected
          assert hasattr(_mx_collect, '_native_result')
          if sysconfig.get_config_var('Py_GIL_DISABLED'):
              assert not sys._is_gil_enabled()
          PY
      - name: Interpreter
        shell: bash
        run: |
          python -c "import sys, sysconfig, platform; print(sys.version, platform.machine(), 'Py_GIL_DISABLED =', sysconfig.get_config_var('Py_GIL_DISABLED'))"
          if [[ "${{ matrix.python-version }}" == *t ]]; then
            python -c "import sys, sysconfig; assert sysconfig.get_config_var('Py_GIL_DISABLED') and not sys._is_gil_enabled()"
          fi
      - name: compiled
        id: compiled
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          C=modelx_cython/tests/compiled
          options=(--import-mode=importlib --rootdir "$GITHUB_WORKSPACE" -p no:cacheprovider
            -o "pythonpath='$GITHUB_WORKSPACE/$C' '$GITHUB_WORKSPACE/integration_tests' '$GITHUB_WORKSPACE/integration_tests/table_matrix'")
          python -m pytest "${options[@]}" --collect-only -q \
            "$GITHUB_WORKSPACE/$C/test_float_vector_of_integers.py" \
            "$GITHUB_WORKSPACE/$C/test_reduction_boolean_list.py" \
            "$GITHUB_WORKSPACE/integration_tests/table_matrix/test_table_matrix.py" \
            "$GITHUB_WORKSPACE/integration_tests/test_forms_flat_asof.py"
          python -m pytest "${options[@]}" \
            -n auto --dist loadfile -q -rfEs \
            --deselect "$C/test_value_storage.py" \
            "$GITHUB_WORKSPACE/$C" "$GITHUB_WORKSPACE/integration_tests"
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "lane ${{ matrix.os }} ${{ matrix.python-version }}: compiled=${{ steps.compiled.outcome }}" | tee -a "$GITHUB_STEP_SUMMARY"

  lane-macos:
    name: ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-latest]
        python-version: ["3.14t", "3.12", "3.14", "3.13t", "3.10"]
    env: *env
    steps: *steps
