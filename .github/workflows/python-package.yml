name: Verify the compiled Collect hook

on:
  push:
    branches: [verify/standalone-collect-compat]

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPILER_PIN: e665d57c2787be0ff42554a9fcf6c3670b47385b
      MODELX_PIN: 990d5852ac8c3deed7e8646365dd4e16c63da368
      LIFELIB_PIN: e50454141680d0f9d65cce7ade81e4987f8c85ac
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: alexeybaran/lifelib
          ref: ${{ env.LIFELIB_PIN }}
          path: lifelib-pin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14t'
      - name: Disable the GIL
        run: echo "PYTHON_GIL=0" >> "$GITHUB_ENV"
      - name: Install the exact source revisions
        run: |
          git merge-base --is-ancestor "$COMPILER_PIN" HEAD
          test "$(git diff --name-only "$COMPILER_PIN" HEAD)" = .github/workflows/python-package.yml
          test "$(git -C lifelib-pin rev-parse HEAD)" = "$LIFELIB_PIN"
          python -m pip install --only-binary scipy,libcst,numpy,pandas . pytest pandas scipy openpyxl psutil
          python -m pip install --force-reinstall --no-deps "git+https://github.com/alexeybaran/modelx@$MODELX_PIN"
          python -m pip install --no-deps -e lifelib-pin
          python -c "import json, os; from importlib.metadata import distribution; assert json.loads(distribution('modelx').read_text('direct_url.json'))['vcs_info']['commit_id'] == os.environ['MODELX_PIN']"
      - name: Build and verify the native Collect fixture
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest --import-mode=importlib --rootdir "$GITHUB_WORKSPACE" -p no:cacheprovider -q -ra \
            --basetemp "$RUNNER_TEMP/native-collect" \
            "$GITHUB_WORKSPACE/modelx_cython/tests/compiled/test_native_collect.py"
      - name: Reject standalone dispatch and verify Direct parity
        working-directory: ${{ runner.temp }}
        run: |
          python - "$RUNNER_TEMP/native-collect" <<'PY'
          import importlib
          from importlib.machinery import ExtensionFileLoader
          from pathlib import Path
          import sys

          def unexpected_executor(*args, **kwargs):
              raise AssertionError("A compiled Collect called the standalone executor")

          paths = [path for path in Path(sys.argv[1]).iterdir()
                   if path.is_dir() and not path.is_symlink() and (path / "exported_cy").is_dir()]
          folder, = paths
          sys.path.insert(0, str(folder))
          package = importlib.import_module("exported_cy")
          classes = importlib.import_module("exported_cy._mx_classes")
          assert isinstance(classes.__loader__, ExtensionFileLoader)
          runtime = importlib.import_module("exported_cy._mx_collect")
          assert callable(runtime._collect_once)
          runtime._collect_once = unexpected_executor
          for workers in (1, 4):
              model = type(package.mx_model)()
              model._mx_collect_workers = workers
              source = model.Source
              assert type(source)._mx_collect_hook_version == 1
              kept = source[7, 0, -1]
              result = source.collect()
              assert result._CollectResult__storage.native is not None
              assert source.collect() is result and source[7, 0, -1] is kept
              assert result.individual[7].value(2) == result.individual[7].value[2] == kept.value(2)
              assert result.individual[7].label['kind'] == 'odd'
              assert result.sum.total == 36.0
              assert sys._is_gil_enabled() is False
              print(f"{workers} worker(s) used the compiled Collect hook and matched Direct")
          PY
