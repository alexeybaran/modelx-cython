name: Verify ordered table reads

on:
  push:
    branches: [verify/regional-ordered-clamp-1]

jobs:
  ordered-read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14t'
      - name: Install exact dependencies
        shell: bash
        run: |
          python -m pip install --only-binary libcst,numpy,pandas \
            "modelx @ git+https://github.com/alexeybaran/modelx@fdc19875bd2445a7093e56e7222ecc1cf29c2ac0" \
            "Cython>=3.2.4" libcst setuptools MonkeyType numpy "pandas>=2.2.2" pytest
          python -m pip install --no-deps .
      - name: Compile and compare the focused lookup fixture
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          PYTHON_GIL: '0'
        run: |
          python -c "import sys, sysconfig; from modelx.export import _mx_collect; assert sysconfig.get_config_var('Py_GIL_DISABLED') and not sys._is_gil_enabled() and hasattr(_mx_collect, '_native_result')"
          python -m pytest -q --import-mode=importlib --rootdir "$GITHUB_WORKSPACE" -p no:cacheprovider \
            -o "pythonpath='$GITHUB_WORKSPACE/integration_tests'" \
            "$GITHUB_WORKSPACE/integration_tests/test_forms_ordered_lookup_array.py"
