name: Python package

on:
  push:
    branches: [main, "verify/**"]
  pull_request:
    branches: [main]

# One job per lane (system x interpreter). Each lane runs, as separate steps that all run
# even when an earlier one fails:
#   unit       the full non-compiled unit suite (modelx_cython/tests without compiled/)
#   compiled   compiled and integration tests, less the 11 that build models with
#              new_space(collect_over=...), development modelx API not in upstream modelx
#   allocation the compiled tests of the allocation change: unwritten values, pickling and
#              copying, and the two-thread test on a locked Space
#   sec        released lifelib SEC models built with mx2cy and compared with live modelx
# Upstream modelx and lifelib come from PyPI (modelx 0.33.0 is upstream main's version);
# scipy (a lifelib dependency) from wheels only, as its newest release has none for 3.13t.
# Python 3.9 is below the supported floor (3.10) and has no lane.
jobs:
  lane:
    name: ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.14", "3.14t", "3.13t"]
    env:
      PYTHON_GIL: ${{ endsWith(matrix.python-version, 't') && '0' || '' }}
      PYTEST_ADDOPTS: ${{ matrix.os == 'windows-latest' && '--basetemp=C:/t' || '' }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package, upstream modelx and lifelib, test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary scipy . pytest pytest-xdist "pandas>=2.2.2" lifelib openpyxl psutil
          python -m pip list
      - name: Interpreter
        shell: bash
        run: |
          python -c "import sys, sysconfig, platform; print(sys.version, platform.machine(), 'Py_GIL_DISABLED =', sysconfig.get_config_var('Py_GIL_DISABLED'))"
          if [[ "${{ matrix.python-version }}" == *t ]]; then
            python -c "import sys, sysconfig; assert sysconfig.get_config_var('Py_GIL_DISABLED') and not sys._is_gil_enabled()"
          fi
      - name: unit
        id: unit
        if: success() || failure()
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python -m pytest --import-mode=importlib --rootdir "$GITHUB_WORKSPACE" -p no:cacheprovider \
            -n auto -q -rfEs \
            "$GITHUB_WORKSPACE/modelx_cython/tests" --ignore="$GITHUB_WORKSPACE/modelx_cython/tests/compiled"
      - name: compiled
        id: compiled
        if: success() || failure()
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          C=modelx_cython/tests/compiled
          python -m pytest --import-mode=importlib --rootdir "$GITHUB_WORKSPACE" -p no:cacheprovider \
            -n auto --dist loadfile -q -rfEs \
            --deselect $C/test_compiled_contract.py::test_exported_contract_and_collection \
            --deselect $C/test_input_scenarios.py::test_new_input_scenario_after_collect \
            --deselect $C/test_locked_numeric_domains.py::test_locked_native_calls_and_dependent_collect_domain \
            --deselect $C/test_over_limit_hash_store.py::test_over_limit_cell_is_one_hash_store_on_both_routes \
            --deselect $C/test_over_limit_hash_store.py::test_removed_spec_key_reuse_dense_windows_is_refused \
            --deselect $C/test_raised_sample_calls.py::test_raised_sample_calls_keep_the_returned_type \
            --deselect $C/test_shared_dense_publish.py::test_shared_dense_cache_publishes_its_flags \
            --deselect $C/test_uncached_entries.py::test_uncached_cells_take_a_direct_entry_and_equal_live \
            --deselect $C/test_value_storage.py \
            "$GITHUB_WORKSPACE/$C" "$GITHUB_WORKSPACE/integration_tests"
      - name: allocation
        id: allocation
        if: success() || failure()
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          C="$GITHUB_WORKSPACE/modelx_cython/tests/compiled"
          python -m pytest --import-mode=importlib --rootdir "$GITHUB_WORKSPACE" -p no:cacheprovider -q -rfEs \
            "$C/test_value_storage.py::test_unwritten_values_after_pickle_and_copy" \
            "$C/test_value_storage.py::test_unwritten_values_of_a_locked_space"
      - name: sec
        id: sec
        if: success() || failure()
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python "$GITHUB_WORKSPACE/.github/scripts/sec_compare.py" sec_term Term_US_SEC term_life
          python "$GITHUB_WORKSPACE/.github/scripts/sec_compare.py" sec_myga MYGA_US_SEC fixed_deferred_annuity
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "lane ${{ matrix.os }} ${{ matrix.python-version }}: unit=${{ steps.unit.outcome }} compiled=${{ steps.compiled.outcome }} allocation=${{ steps.allocation.outcome }} sec=${{ steps.sec.outcome }}" | tee -a "$GITHUB_STEP_SUMMARY"
