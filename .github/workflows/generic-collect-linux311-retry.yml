name: Retry released-model tests with pinned dependencies

on:
  push:
    branches: [verify/r3-generic-private-collect-linux311]

jobs:
  released-models:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: macos-15-intel, python: "3.11"}
          - {os: macos-15-intel, python: "3.14"}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b50f7be8dd48fa541b496331e944f091011d1302
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and released-model dependencies
        run: python -m pip install . pytest "pandas>=2.2.2" "lifelib==0.17.4" openpyxl "psutil==7.2.2" "modelx @ git+https://github.com/alexeybaran/modelx.git@861396000edaae329d4473cdd97c0d1aea52a71f"
      - name: Run released lifelib model tests
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest --import-mode=importlib -q \
            "$GITHUB_WORKSPACE/modelx_cython/tests/test_samples.py::test_mx2cy_with_lifelib" \
            "$GITHUB_WORKSPACE/modelx_cython/tests/test_annuallife.py" \
            "$GITHUB_WORKSPACE/modelx_cython/tests/test_uslib.py"
