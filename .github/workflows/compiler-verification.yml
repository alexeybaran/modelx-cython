name: Compiler verification

on:
  push:
    branches: [verify/compiler-stack]
    paths: [.github/workflows/compiler-verification.yml]

permissions:
  contents: read

jobs:
  runtime:
    name: ${{ matrix.feature }} / ${{ matrix.runner }} / ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        feature: [Direct, Collect, Regional]
        runner: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14', '3.14t', '3.13t']
        suite: [standard]
    env: &runtime-env
      CYTHON_VERSION: ${{ endsWith(matrix.python, 't') && '3.3.2' || '3.2.4' }}
      PYTHONIOENCODING: utf-8
      PYTEST_ADDOPTS: ${{ matrix.runner == 'windows-latest' && '--basetemp=C:/t' || '' }}
    steps: &runtime-steps
      - &pins
        name: Select source revisions
        id: pins
        shell: bash
        env:
          FEATURE: ${{ matrix.feature }}
          SUITE: ${{ matrix.suite }}
        run: |
          case "$FEATURE" in
            Direct)
              compiler=5186502062501beccf780a190712e6198b9b14fa
              modelx=7e6ac7a4018248c373a7c43ede951363a1d4cf10
              ;;
            Collect)
              compiler=3cd839da63b630ab964b018b3502b65044fb6b0a
              modelx=d41b2d2fdeca5ad42aae322158450aa5136f5f50
              ;;
            Regional)
              compiler=71538272408396cfb01492e0cb464ed232b8067d
              modelx=d41b2d2fdeca5ad42aae322158450aa5136f5f50
              ;;
            *) exit 1 ;;
          esac
          case "$SUITE" in
            standard|package) lifelib=20d4daef3281d538b3fbda6d0fb951fcceb3a6f4 ;;
            regional) lifelib=04d69dbb16a9a49f2d569047a8deebdc1f026c28 ;;
            sec-dv01) lifelib=8705987e94103ffa7088d142df0333ef7e4e91eb ;;
            *) exit 1 ;;
          esac
          printf 'compiler=%s\nmodelx=%s\nlifelib=%s\n' "$compiler" "$modelx" "$lifelib" >> "$GITHUB_OUTPUT"
      - &compiler
        name: Check out compiler
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: alexeybaran/modelx-cython
          ref: ${{ steps.pins.outputs.compiler }}
          path: compiler
          persist-credentials: false
      - &modelx
        name: Check out modelx
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: alexeybaran/modelx
          ref: ${{ steps.pins.outputs.modelx }}
          path: modelx
          persist-credentials: false
      - name: Check out lifelib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: alexeybaran/lifelib
          ref: ${{ steps.pins.outputs.lifelib }}
          path: lifelib
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Disable the GIL on free-threaded Python
        if: endsWith(matrix.python, 't')
        shell: bash
        run: echo 'PYTHON_GIL=0' >> "$GITHUB_ENV"
      - name: Verify source revisions
        shell: bash
        env:
          COMPILER: ${{ steps.pins.outputs.compiler }}
          MODELX: ${{ steps.pins.outputs.modelx }}
          LIFELIB: ${{ steps.pins.outputs.lifelib }}
        run: |
          for entry in "compiler $COMPILER" "modelx $MODELX" "lifelib $LIFELIB"; do
            read -r project expected <<< "$entry"
            actual=$(git -C "$project" rev-parse HEAD)
            test "$actual" = "$expected"
            test -z "$(git -C "$project" status --porcelain)"
            echo "$project $actual" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Install the compiler and its pinned companions
        id: install
        shell: bash
        env:
          FEATURE: ${{ matrix.feature }}
          SUITE: ${{ matrix.suite }}
        run: |
          python -m pip install --upgrade pip
          companions=(./modelx)
          if [[ "$SUITE" != regional ]]; then
            companions+=(./lifelib)
          fi
          python -m pip install --only-binary scipy,libcst,numpy,pandas \
            "${companions[@]}" "Cython==$CYTHON_VERSION" libcst setuptools MonkeyType numpy scipy \
            'pytest==8.4.2' pytest-xdist 'pandas>=2.2.2' openpyxl psutil
          if [[ "$SUITE" == regional ]]; then
            python -m pip install --no-deps ./lifelib
          fi
          if [[ "$FEATURE" == Direct ]]; then
            python -m pip install --only-binary scipy,libcst,numpy,pandas ./compiler
            python -m pip check
          else
            # The exact modelx source revision still declares version 0.33.0.
            python -m pip install --no-deps ./compiler
            if outcome=$(python -m pip check); then
              echo 'Expected the pinned modelx version to be below the compiler dependency floor.'
              exit 1
            fi
            PIP_CHECK_OUTPUT="$outcome" python - <<'PY'
          import os
          import re

          expected = {"modelx-cython"}
          if os.environ["SUITE"] == "regional":
              expected.add("lifelib")
          conflicts = os.environ["PIP_CHECK_OUTPUT"].splitlines()
          for line in conflicts:
              match = re.fullmatch(
                  r"(\S+) \S+ (?:has requirement|requires) modelx>=0\.33\.1\.dev0, but you have modelx 0\.33\.0\.",
                  line,
              )
              assert match, line
              expected.remove(match[1])
          assert not expected, expected
          PY
            echo "$outcome" >> "$GITHUB_STEP_SUMMARY"
          fi
          python -m pip list
      - name: Verify installed sources and interpreter
        id: installed
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          EXPECT_FREE_THREADED: ${{ endsWith(matrix.python, 't') }}
        run: |
          python - <<'PY'
          import importlib
          from importlib import metadata
          import json
          import os
          from pathlib import Path
          import sys
          import sysconfig

          work = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for name, checkout in (("modelx_cython", "compiler"), ("modelx", "modelx"), ("lifelib", "lifelib")):
              module = importlib.import_module(name)
              dist = metadata.distribution(name)
              info = json.loads(dist.read_text("direct_url.json"))
              assert info["url"].casefold() == (work / checkout).as_uri().casefold(), info
              assert Path(module.__file__).resolve().is_relative_to(Path(dist.locate_file("")).resolve())
              assert not Path(module.__file__).resolve().is_relative_to(work)
              print(name, dist.version, info["url"])

          free_threaded = bool(sysconfig.get_config_var("Py_GIL_DISABLED"))
          assert free_threaded == (os.environ["EXPECT_FREE_THREADED"] == "true")
          cython_version = metadata.version("Cython")
          assert cython_version == os.environ["CYTHON_VERSION"], cython_version
          if free_threaded:
              assert not sys._is_gil_enabled()
          print(sys.version, "free-threaded:", free_threaded, "Cython:", cython_version)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              print(f"COMPILER_PATH={(work / 'compiler').as_posix()}", file=env)
              print(f"LIFELIB_PATH={(work / 'lifelib').as_posix()}", file=env)
          PY
      - name: Unit suite
        id: unit
        if: ${{ !cancelled() && steps.installed.outcome == 'success' && matrix.suite != 'sec-dv01' }}
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          S="$COMPILER_PATH"
          T="$S/modelx_cython/tests"
          python -m pytest --import-mode=importlib --rootdir "$S" -p no:cacheprovider \
            -n auto -q -rfEs "$T" --ignore="$T/compiled"
      - name: Compiled and integration suites
        id: compiled
        if: ${{ !cancelled() && steps.installed.outcome == 'success' && matrix.suite != 'sec-dv01' }}
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          S="$COMPILER_PATH"
          C="$S/modelx_cython/tests/compiled"
          I="$S/integration_tests"
          python -m pytest --import-mode=importlib --rootdir "$S" -p no:cacheprovider \
            -o "pythonpath='$C' '$I' '$I/table_matrix'" \
            -n auto --dist loadfile -q -rfEs --ignore="$C/test_value_storage.py" "$C" "$I"
      - name: Allocation tests
        id: allocation
        if: ${{ !cancelled() && steps.installed.outcome == 'success' && matrix.suite == 'standard' }}
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          S="$COMPILER_PATH"
          python -m pytest --import-mode=importlib --rootdir "$S" -p no:cacheprovider \
            -q -rfEs "$S/modelx_cython/tests/compiled/test_value_storage.py"
      - name: SEC models against live modelx
        id: sec
        if: ${{ !cancelled() && steps.installed.outcome == 'success' && matrix.suite == 'standard' }}
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          S="$COMPILER_PATH"
          runner="$S/.github/scripts/sec_compare.py"
          python "$runner" sec_term Term_US_SEC term_life
          python "$runner" sec_myga MYGA_US_SEC fixed_deferred_annuity
          python "$runner" sec_spia SPIA_US_SEC immediate_annuity
      - name: SEC DV01 compiled tests
        id: sec-dv01
        if: ${{ !cancelled() && steps.installed.outcome == 'success' && matrix.suite == 'sec-dv01' }}
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          T="$LIFELIB_PATH/lifelib/libraries/uslib/tests"
          python -m pytest --import-mode=importlib -o "pythonpath='$T'" -p no:cacheprovider \
            -q -rfEs -m cython --junitxml=sec-dv01.xml \
            "$T/test_fixed_deferred_annuity_us_sec_dv01.py"
          python - <<'PY'
          from xml.etree import ElementTree as ET

          cases = ET.parse("sec-dv01.xml").findall(".//testcase")
          assert len(cases) == 4
          assert all(len(case) == 0 for case in cases)
          PY
      - name: Results
        if: always()
        shell: bash
        run: |
          echo "Unit: ${{ steps.unit.outcome }}, compiled and integration: ${{ steps.compiled.outcome }}, allocation: ${{ steps.allocation.outcome }}, SEC: ${{ steps.sec.outcome }}, SEC DV01: ${{ steps.sec-dv01.outcome }}" >> "$GITHUB_STEP_SUMMARY"

  runtime-macos:
    name: ${{ matrix.feature }} / macOS / ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        feature: [Direct, Collect, Regional]
        runner: [macos-latest]
        python: ['3.10', '3.12', '3.14', '3.14t', '3.13t']
        suite: [standard]
    env: *runtime-env
    steps: *runtime-steps

  consumers:
    name: ${{ matrix.feature }} / ${{ matrix.suite }} / ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - {feature: Regional, suite: regional, runner: ubuntu-latest, python: '3.14t'}
          - {feature: Collect, suite: sec-dv01, runner: ubuntu-latest, python: '3.14t'}
          - {feature: Regional, suite: sec-dv01, runner: ubuntu-latest, python: '3.14t'}
    env: *runtime-env
    steps: *runtime-steps

  package:
    name: ${{ matrix.feature }} / wheel installation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [Direct, Collect, Regional]
        suite: [package]
    steps:
      - *pins
      - *compiler
      - *modelx
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and verify distributions
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          FEATURE: ${{ matrix.feature }}
          COMPILER: ${{ steps.pins.outputs.compiler }}
          MODELX: ${{ steps.pins.outputs.modelx }}
        run: |
          S="$GITHUB_WORKSPACE/compiler"
          M="$GITHUB_WORKSPACE/modelx"
          test "$(git -C "$S" rev-parse HEAD)" = "$COMPILER"
          test "$(git -C "$M" rev-parse HEAD)" = "$MODELX"
          test -z "$(git -C "$S" status --porcelain)"
          test -z "$(git -C "$M" status --porcelain)"
          python -m pip install --upgrade pip build twine
          python -m build --outdir compiler-dist "$S"
          python -m twine check compiler-dist/*
          if [[ "$FEATURE" != Direct ]]; then
            python -m build --wheel --outdir exact-modelx-dist "$M"
            if resolution=$(python -m pip install --dry-run --ignore-installed \
              --only-binary scipy,libcst,numpy,pandas exact-modelx-dist/*.whl compiler-dist/*.whl 2>&1); then
              echo 'Expected the exact modelx wheel to be below the compiler dependency floor.'
              exit 1
            fi
            grep -F 'ResolutionImpossible' <<< "$resolution"
            grep -F 'depends on modelx>=0.33.1.dev0' <<< "$resolution"

            # Give the companion wheel the declared dependency version for this test.
            # The checked-out companion code and its runtime version stay unchanged.
            python - "$M/setup.py" <<'PY'
          import sys
          from pathlib import Path

          setup = Path(sys.argv[1])
          source = setup.read_bytes()
          original = b"    version=VERSION,"
          assert source.count(original) == 1
          setup.write_bytes(source.replace(original, b'    version="0.33.1.dev0",'))
          PY
            test "$(git -C "$M" diff --name-only HEAD)" = setup.py
            echo 'Installation uses a companion wheel with a test distribution version of 0.33.1.dev0.' >> "$GITHUB_STEP_SUMMARY"
          fi
          python -m build --wheel --outdir modelx-dist "$M"
          python -m venv installed
          source installed/bin/activate
          python -m pip install --only-binary scipy,libcst,numpy,pandas modelx-dist/*.whl compiler-dist/*.whl
          python -m pip check
          python -m modelx_cython --help
          mx2cy --help
