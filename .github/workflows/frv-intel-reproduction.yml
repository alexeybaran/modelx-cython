name: FRV Intel macOS and its mapped stack limit

on:
  push:
    branches: [verify/r3-frv-stack-limit]

permissions:
  contents: read

jobs:
  reproduce:
    name: FRV ${{ matrix.name }} on Intel macOS
    runs-on: macos-15-intel
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: current
            lifelib: df21bf5beb2207f72c437e8e805a0c51dc4f5525
            modelx: f0e91ec74f3363104f27a220d6584a639a4cf1e2
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: alexeybaran/lifelib
          ref: ${{ matrix.lifelib }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.21"
          architecture: x64
      - name: Install matched dependencies
        shell: bash
        run: |
          python -m pip install "modelx @ git+https://github.com/alexeybaran/modelx.git@${{ matrix.modelx }}" \
            numpy==2.2.6 pandas==2.3.3 networkx==3.4.2 libcst==1.9.0 \
            openpyxl==3.1.5 asttokens==3.0.2 pytest==9.2.0 pytest-cov==7.1.0 pytest-xdist==3.8.0 \
            pluggy==1.7.0 python-dateutil==3.0.0 pytz==2026.6 pyyaml==6.0.4 tzdata==2026.6
          python -m pip install --no-deps -e .
          python -m pip freeze
          python -c "import platform, resource, sys; assert platform.machine() == 'x86_64'; print(sys.version, sys.getrecursionlimit(), resource.getrlimit(resource.RLIMIT_STACK))"
      - name: Compare an increased limit with the actual mapped stack size
        shell: bash
        run: |
          ulimit -Ss "$(ulimit -Hs)"
          python - <<'PY'
          import ctypes
          import resource
          lib = ctypes.CDLL(None)
          lib.pthread_self.restype = ctypes.c_void_p
          lib.pthread_get_stacksize_np.argtypes = (ctypes.c_void_p,)
          lib.pthread_get_stacksize_np.restype = ctypes.c_size_t
          print("pthread stack size", lib.pthread_get_stacksize_np(lib.pthread_self()))
          print("resource limit", resource.getrlimit(resource.RLIMIT_STACK))
          PY
          test=lifelib/libraries/delib/tests/test_fondsgebundene_rentenversicherung_de.py::test_the_reduction_in_yield_across_the_four_charge_scales
          python -m pytest -vv "${test}[5]"
