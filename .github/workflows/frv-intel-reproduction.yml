name: FRV Intel macOS aligned threaded executor

on:
  push:
    branches: [verify/r3-frv-aligned-executor]

permissions:
  contents: read

jobs:
  reproduce:
    name: FRV ${{ matrix.name }} on Intel macOS
    runs-on: macos-15-intel
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: current
            lifelib: aef70a0de23b3ca677cdaf3b61aa9a302243e7b4
            modelx: f0e91ec74f3363104f27a220d6584a639a4cf1e2
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: alexeybaran/lifelib
          ref: ${{ matrix.lifelib }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.21"
          architecture: x64
      - name: Install matched dependencies
        shell: bash
        run: |
          python -m pip install "modelx @ git+https://github.com/alexeybaran/modelx.git@${{ matrix.modelx }}" \
            numpy==2.2.6 pandas==2.3.3 networkx==3.4.2 libcst==1.9.0 \
            openpyxl==3.1.5 asttokens==3.0.2 pytest==9.2.0 pytest-cov==7.1.0 pytest-xdist==3.8.0 \
            pluggy==1.7.0 python-dateutil==3.0.0 pytz==2026.6 pyyaml==6.0.4 tzdata==2026.6
          python -m pip install --no-deps -e .
          python -m pip freeze
          python -c "import platform, resource, sys; assert platform.machine() == 'x86_64'; print(sys.version, sys.getrecursionlimit(), resource.getrlimit(resource.RLIMIT_STACK))"
      - name: Evaluate the same formulas through the existing large-stack executor
        timeout-minutes: 8
        shell: bash
        run: |
          test=lifelib/libraries/delib/tests/test_fondsgebundene_rentenversicherung_de.py::test_the_reduction_in_yield_across_the_four_charge_scales
          python - "${test}[5]" <<'PY'
          import sys
          import threading
          from unittest.mock import patch
          import modelx
          import pytest
          from modelx.core.execution.executor import ThreadedExecutor
          from modelx.core.system import mxsys

          original_stack_size = threading.stack_size

          def aligned_stack_size(size):
              if size == 0x10000000 - 1:
                  size = 0x10000000
                  print(f"Requesting aligned worker stack: {size} bytes", flush=True)
              return original_stack_size(size)

          with patch.object(threading, "stack_size", aligned_stack_size):
              executor = ThreadedExecutor(maxdepth=mxsys.callstack.maxdepth)
          mxsys.executor = executor
          mxsys.callstack = executor.callstack
          mxsys.refstack = executor.refstack
          raise SystemExit(pytest.main(["-vv", *sys.argv[1:]]))
          PY
