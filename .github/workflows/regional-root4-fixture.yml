name: Regional parallel RootLocal fixture

on:
  push:
    branches: [verify/regional-root4-fixture-1]

jobs:
  collect-fixture:
    name: ${{ matrix.os }} CPython 3.14.10t
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTEST_ADDOPTS: ${{ matrix.os == 'windows-latest' && '--basetemp=C:/t' || '' }}
      PYTHONIOENCODING: utf-8
      MX_CY_STRICT_LOWERING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10t'
      - name: Enable free-threaded tests
        shell: bash
        run: echo 'PYTHON_GIL=0' >> "$GITHUB_ENV"
      - name: Install exact modelx and compiler
        shell: bash
        run: |
          python -m pip install --only-binary libcst,numpy,pandas \
            'Cython==3.3.2' 'libcst==1.9.0' 'numpy==2.5.5' 'pandas==3.1.1' \
            'pytest==9.2.0' 'setuptools==84.2.1' 'MonkeyType==23.3.0' 'openpyxl==3.1.5' 'psutil==7.2.2' \
            'git+https://github.com/alexeybaran/modelx@990d5852ac8c3deed7e8646365dd4e16c63da368'
          # The pinned fork advertises 0.33.0 and the compiler requires 0.33.1.dev0.
          python -m pip install --no-deps .
      - name: Verify the exact fixture
        id: fixture
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata
          import json
          import sys
          import modelx
          import modelx_cython
          source = json.loads(importlib.metadata.distribution('modelx').read_text('direct_url.json'))
          commit = source['vcs_info']['commit_id']
          print(sys.version, 'GIL enabled:', sys._is_gil_enabled(), 'modelx commit:', commit)
          assert sys.version_info[:3] == (3, 14, 10) and not sys._is_gil_enabled()
          assert commit == '990d5852ac8c3deed7e8646365dd4e16c63da368'
          PY
          fixture="$GITHUB_WORKSPACE/modelx_cython/tests/compiled/test_collect_native_merge.py"
          python -m pytest --rootdir "$GITHUB_WORKSPACE" -p no:cacheprovider -q -rA \
            "$fixture::test_native_and_python_outputs_equal_the_export"
      - name: Record MixedPython coordinate evidence if the exact fixture fails
        if: failure() && steps.fixture.outcome == 'failure'
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          fixture="$GITHUB_WORKSPACE/modelx_cython/tests/compiled/test_collect_native_merge.py"
          scratch=$(mktemp -d)
          witness="$scratch/test_collect_native_merge.py"
          python - "$fixture" "$witness" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text(encoding='utf-8')
          check = '            assert [item.keys for item in python_result.individual.values()]'
          child = '''            print("MIXEDPYTHON_WITNESS", json.dumps({
                          "package": package, "workers": workers,
                          "individual": plain(python_result.individual),
                          "sum": plain(python_result.sum),
                      }), file=sys.stderr)
          '''
          completed = '        assert done.returncode == 0, done.stderr\n'
          assert source.count(check) == 1 and source.count(completed) >= 1
          source = source.replace(check, child + check, 1)
          source = source.replace(completed, "        print(done.stderr, end='')\n" + completed, 1)
          Path(sys.argv[2]).write_text(source, encoding='utf-8')
          PY
          python -m pytest --rootdir "$GITHUB_WORKSPACE" -p no:cacheprovider -q -s -rA \
            "$witness::test_native_and_python_outputs_equal_the_export"
